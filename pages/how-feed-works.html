<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How FEED Works | Feed World</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/components/navbar.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />
  <link rel="stylesheet" href="../assets/css/pages/how-feed-works.css" />

  <script src="../assets/js/core/file-protocol-check.js"></script>
  <script type="module" src="../assets/js/pages/how-feed-works.js"></script>
</head>
<body>
  <div class="app-container is-home">
    <div class="main-content-bg">
      <div style="display: flex; flex-direction: column; min-height: 100vh; background-color: #f8fafc;">
        <div id="site-navbar"></div>

        <!-- Premium Layered Background -->
        <div class="hfw-bg-wrapper">
          <svg preserveAspectRatio="none" viewBox="0 0 1440 800" class="hfw-wave-svg">
            <defs>
              <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
              <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0ea5e9" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
              <radialGradient id="grad-blue" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#0a3a6b" />
                <stop offset="100%" stop-color="#061f3a" />
              </radialGradient>
            </defs>
            <!-- Green Layer (Back) -->
            <path fill="url(#grad-green)" d="M 0 0 L 0 650 C 300 800, 700 200, 1440 0 L 0 0 Z" />
            <!-- Cyan Layer (Middle) -->
            <path fill="url(#grad-cyan)" d="M 0 0 L 0 550 C 250 700, 600 150, 1250 0 L 0 0 Z" />
            <!-- Blue Layer (Front) -->
            <path fill="url(#grad-blue)" d="M 0 0 L 0 450 C 200 600, 500 100, 1100 0 L 0 0 Z" />
          </svg>
        </div>

        <main class="hfw-main">
          <header class="hfw-header anim-fade-in-up">
            <h1 class="hfw-title">How FEED Works...</h1>
            <div class="hfw-title-underline"></div>
          </header>

          <!-- Category Navigation -->
          <div class="hfw-category-nav-wrapper anim-fade-in-up" style="animation-delay: 0.1s;">
            <div class="hfw-category-list" id="hfw-categories">
              <button type="button" class="hfw-category-item active" data-tab="fpo"><i data-icon="leaf" data-size="18" data-stroke-width="2.5"></i>FPO</button>
              <button type="button" class="hfw-category-item" data-tab="farming"><i data-icon="settings" data-size="18" data-stroke-width="2.5"></i>FARMING</button>
              <button type="button" class="hfw-category-item" data-tab="epm"><i data-icon="globe-2" data-size="18" data-stroke-width="2.5"></i>EPM</button>
              <button type="button" class="hfw-category-item" data-tab="marketing"><i data-icon="lightbulb" data-size="18" data-stroke-width="2.5"></i>MARKETING</button>
              <button type="button" class="hfw-category-item" data-tab="trading"><i data-icon="trending-up" data-size="18" data-stroke-width="2.5"></i>TRADING</button>
              <button type="button" class="hfw-category-item" data-tab="b2b"><i data-icon="store" data-size="18" data-stroke-width="2.5"></i>B2B MARKET</button>
              <button type="button" class="hfw-category-item" data-tab="course"><i data-icon="graduation-cap" data-size="18" data-stroke-width="2.5"></i>COURSE CERTIFICATIONS</button>
            </div>
          </div>

          <!-- Video Cards Area -->
          <div class="hfw-cards-container">
            <div class="hfw-card hfw-card-bg-dark anim-zoom-in" style="animation-delay: 0.2s;">
              <div class="hfw-video-wrapper">
                <iframe src="https://www.youtube.com/embed/ka-nmA0DOAI?rel=0" title="FARM TO FOREIGN EXPORTS"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            </div>
            <div class="hfw-card hfw-card-bg-light anim-zoom-in" style="animation-delay: 0.3s;">
              <div class="hfw-video-wrapper">
                <iframe src="https://www.youtube.com/embed/bOkzpur79Us?rel=0" title="FEED - EXPORTS &amp; IMPORTS"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            </div>
          </div>
        </main>

        <div id="site-footer"></div>
      </div>
    </div>
  </div>
</body>
</html>
