<body>
  <!-- One Feed World issue, full-window, in its own tab (?id=<publicationId>). No site wrapper,
       navbar or footer - this page stands alone. -->
  <div class="pub-reader">
    <header class="pub-reader-bar">
      <button type="button" class="pub-reader-brand" data-action="all-publications" title="All Feed World publications">
        <span class="pub-reader-logo"><img src="../assets/images/dashboard-logo.avif" alt="" /></span>
        <span class="pub-reader-brand-text">
          <strong>FEED WORLD</strong>
          <small>Publications</small>
        </span>
      </button>

      <div class="pub-reader-heading"></div>
    </header>

    <main class="pub-reader-stage"></main>
  </div>
</body>
