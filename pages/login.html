<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Feed World</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/pages/login.css" />

  <script src="../assets/js/core/file-protocol-check.js"></script>
  <script type="module" src="../assets/js/pages/login.js"></script>
</head>
<body>
  <div class="fullscreen-login-wrapper" style="background-image: url(../assets/images/Login.avif); background-size: cover; background-position: center 75%; background-repeat: no-repeat; background-color: #f4f4f9; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding-right: 6%; margin: 0; position: fixed; top: 0; left: 0; font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div class="login-panel" id="login-panel" style="background: #faf9f6; border-radius: 32px; padding: 32px 40px 20px 40px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none;">

      <!-- Notification popup (top right) is inserted here, as the panel's first child, by login.js -->

      <!-- Back Button -->
      <button type="button" data-nav="home" data-hover="back" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: none; border: none; color: #6b7280; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 16px; transition: color 0.2s;">
        <i data-icon="arrow-left" data-size="18"></i>
        Back to Home
      </button>

      <!-- Logo Section -->
      <div id="login-logo" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 16px;">
        <img src="../assets/images/logo.avif" alt="Feed Logo" style="height: 180px; object-fit: contain;" />
      </div>

      <!-- The "Maximum devices reached" screen replaces the form, divider and register box after a 409 (login.js) -->

      <!-- Form -->
      <form id="login-form" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
        <!-- Email Input -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 600; color: #1a1a1a;">Email or Phone Number</label>
          <div style="position: relative; display: flex; align-items: center;">
            <div style="position: absolute; left: 14px; color: #9ca3af; display: flex;">
              <i data-icon="mail" data-size="18" data-stroke-width="2"></i>
            </div>
            <input type="text" data-field="email" placeholder="Enter your email or phone number" required style="width: 100%; padding: 12px 16px 12px 42px; border-radius: 8px; border: 1px solid #e5e7eb; background: #ffffff; font-size: 14px; outline: none; box-sizing: border-box; color: #1a1a1a; transition: border-color 0.2s;" />
          </div>
        </div>

        <!-- Password Input -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 600; color: #1a1a1a;">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <div style="position: absolute; left: 14px; color: #9ca3af; display: flex;">
              <i data-icon="lock" data-size="18" data-stroke-width="2"></i>
            </div>
            <input type="password" data-field="password" placeholder="Enter your password" required style="width: 100%; padding: 12px 42px 12px 42px; border-radius: 8px; border: 1px solid #e5e7eb; background: #ffffff; font-size: 14px; outline: none; box-sizing: border-box; color: #1a1a1a; transition: border-color 0.2s;" />
            <button type="button" data-action="toggle-password" style="position: absolute; right: 14px; background: none; border: none; cursor: pointer; color: #9ca3af; display: flex; padding: 0;">
              <i data-icon="eye-off" data-size="18" data-stroke-width="2"></i>
            </button>
          </div>
        </div>

        <!-- Remember me & Forgot Password -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -4px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; cursor: pointer;">
            <input type="checkbox" class="custom-checkbox" data-field="remember-me" checked />
            Remember me
          </label>
          <a href="#" style="font-size: 13px; color: #3e6b36; text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" data-hover="submit" style="width: 100%; padding: 14px 20px; border-radius: 8px; border: none; background: #3e6b36; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; box-shadow: 0 4px 12px rgba(62, 107, 54, 0.2); opacity: 1;"><span style="flex: 1; text-align: center;">Login</span><i data-icon="arrow-right" data-size="20"></i></button>
      </form>

      <!-- OR Divider -->
      <div id="login-or" style="display: flex; align-items: center; width: 100%; margin: 16px 0; color: #6b7280; font-size: 12px; font-weight: 600;">
        <div style="flex: 1; height: 1px; background-color: #e5e7eb;"></div>
        <span style="margin: 0 16px;">OR</span>
        <div style="flex: 1; height: 1px; background-color: #e5e7eb;"></div>
      </div>

      <!-- Registration Section -->
      <div id="login-register-section" style="width: 100%; background: #f1f4ed; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-sizing: border-box;">
        <span style="font-size: 14px; color: #6b7280;">Don't have an account?</span>
        <button type="button" data-nav="register" data-hover="register" style="width: 100%; padding: 12px 20px; border-radius: 8px; border: 1px solid #3e6b36; background: transparent; color: #3e6b36; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s;">
          <i data-icon="user-plus" data-size="18"></i>
          Register Now
        </button>
      </div>

    </div>
  </div>
</body>
</html>
